const SND=(()=>{let ac=null,mg=null,mt=false,pd=null,dd={w:0,b:0};

   const o=ac.createOscillator(),lp=ac.createBiquadFilter(),og=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(50*Math.pow(5.2,p0),t);o.frequency.exponentialRampToValueAtTime(260,t+d);lp.type='lowpass';lp.frequency.value=700;og.gain.setValueAtTime(.001+.16*p0*p0,t);og.gain.exponentialRampToValueAtTime(.16,t+d);og.gain.linearRampToValueAtTime(0,t+d+.06);o.connect(lp);lp.connect(og);og.connect(mg);o.start(t);o.stop(t+d+.1)},
