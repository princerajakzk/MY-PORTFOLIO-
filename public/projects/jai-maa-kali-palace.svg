<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="mk-bg" x1="0" y1="0" x2="0" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1c130b"/>
      <stop offset="0.4" stop-color="#2c1a0e"/>
      <stop offset="1" stop-color="#120c06"/>
    </linearGradient>
    <linearGradient id="mk-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="mk-sofa" x1="0" y1="0" x2="0" y2="100%">
      <stop stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="mk-curtain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop stop-color="#d97706" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" rx="16" fill="url(#mk-bg)"/>
  <rect width="1200" height="700" rx="16" stroke="rgba(251,191,36,0.2)" stroke-width="2"/>

  <!-- Ornate Floral Backdrop Artwork -->
  <!-- Top Floral Hanging Garland Canopy -->
  <path d="M0 0 L1200 0 L1200 130 C1000 150 800 120 600 145 C400 120 200 150 0 130 Z" fill="#2d1a0e"/>
  <!-- Hanging floral strands -->
  <g stroke="#fef08a" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 8" opacity="0.65">
    <line x1="60" y1="120" x2="60" y2="280"/>
    <line x1="120" y1="120" x2="120" y2="250"/>
    <line x1="180" y1="120" x2="180" y2="300"/>
    <line x1="240" y1="120" x2="240" y2="270"/>
    <line x1="300" y1="120" x2="300" y2="290"/>
    <line x1="900" y1="120" x2="900" y2="290"/>
    <line x1="960" y1="120" x2="960" y2="260"/>
    <line x1="1020" y1="120" x2="1020" y2="310"/>
    <line x1="1080" y1="120" x2="1080" y2="270"/>
    <line x1="1140" y1="120" x2="1140" y2="290"/>
  </g>

  <!-- Golden Stage Drapes -->
  <rect x="420" y="110" width="360" height="420" fill="url(#mk-curtain)" opacity="0.7"/>
  <rect x="440" y="130" width="320" height="380" fill="none" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.3"/>
  <rect x="460" y="150" width="280" height="340" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Floral Frame Arches Left & Right -->
  <rect x="80" y="160" width="140" height="420" rx="10" fill="#1f140e" stroke="rgba(245,158,11,0.25)" stroke-width="1.5"/>
  <circle cx="150" cy="220" r="16" fill="#ef4444" opacity="0.7"/>
  <circle cx="130" cy="280" r="14" fill="#fbbf24" opacity="0.6"/>
  <circle cx="165" cy="340" r="16" fill="#ef4444" opacity="0.7"/>
  <circle cx="140" cy="410" r="15" fill="#fbbf24" opacity="0.6"/>

  <rect x="980" y="160" width="140" height="420" rx="10" fill="#1f140e" stroke="rgba(245,158,11,0.25)" stroke-width="1.5"/>
  <circle cx="1050" cy="220" r="16" fill="#ef4444" opacity="0.7"/>
  <circle cx="1030" cy="280" r="14" fill="#fbbf24" opacity="0.6"/>
  <circle cx="1065" cy="340" r="16" fill="#ef4444" opacity="0.7"/>
  <circle cx="1040" cy="410" r="15" fill="#fbbf24" opacity="0.6"/>

  <!-- Royal Red & Gold Wedding Throne Sofa -->
  <g transform="translate(600, 470)">
    <!-- Golden Carved Backrest Frame -->
    <path d="M-130 -40 C-110 -90 -40 -105 0 -80 C40 -105 110 -90 130 -40 C140 -20 135 15 125 35 L-125 35 C-135 15 -140 -20 -130 -40 Z" fill="#b45309" stroke="#fbbf24" stroke-width="3"/>
    <!-- Red Velvet Cushion -->
    <path d="M-115 -35 C-95 -75 -35 -90 0 -70 C35 -90 95 -75 115 -35 C120 -15 115 15 105 30 L-105 30 C-115 15 -120 -15 -115 -35 Z" fill="url(#mk-sofa)"/>
    <!-- Seat Cushion -->
    <rect x="-140" y="25" width="280" height="42" rx="14" fill="url(#mk-sofa)" stroke="#fbbf24" stroke-width="2"/>
    <!-- Golden Legs -->
    <path d="M-125 65 L-135 95 L-115 95 L-115 65 Z" fill="#d97706"/>
    <path d="M125 65 L135 95 L115 95 L115 65 Z" fill="#d97706"/>
  </g>

  <!-- Top Navbar -->
  <rect x="0" y="0" width="1200" height="68" fill="#120c06" fill-opacity="0.9" stroke="rgba(251,191,36,0.15)" stroke-width="1"/>
  <!-- Hindi/English Brand -->
  <text x="50" y="36" fill="#fef08a" font-family="'Segoe UI', serif" font-size="20" font-weight="700">जय माँ काली</text>
  <text x="50" y="52" fill="#d4af37" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" letter-spacing="2">MARRIAGE PALACE</text>

  <!-- Nav Links -->
  <g font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e5e5e5" letter-spacing="1.5">
    <text x="420" y="42">VENUES</text>
    <text x="520" y="42">GALLERY</text>
    <text x="630" y="42">PACKAGES</text>
    <text x="750" y="42">REVIEWS</text>
    <text x="860" y="42">CONTACT</text>
  </g>
  <rect x="990" y="18" width="150" height="34" rx="4" fill="#fbbf24"/>
  <text x="1065" y="40" fill="#1c130b" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">ENQUIRE NOW</text>

  <!-- Main Hero Typography Overlay -->
  <g transform="translate(60, 240)">
    <text x="0" y="0" fill="#fef08a" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="2.5">GIRWAI • NEAR PURANA THANA</text>
    <text x="0" y="46" fill="#ffffff" font-family="'Georgia', serif" font-size="44" font-weight="700">Where Every</text>
    <text x="0" y="98" fill="#fbbf24" font-family="'Georgia', serif" font-size="52" font-weight="700" font-style="italic">Celebration</text>
    <text x="0" y="146" fill="#ffffff" font-family="'Georgia', serif" font-size="44" font-weight="700">Becomes a Memory</text>

    <!-- Subtitle -->
    <text x="0" y="185" fill="#d1d5db" font-family="'Segoe UI', sans-serif" font-size="13" opacity="0.9">Jai Maa Kali Marriage Palace offers a spacious banquet hall, open lawn,</text>
    <text x="0" y="205" fill="#d1d5db" font-family="'Segoe UI', sans-serif" font-size="13" opacity="0.9">and complete event facilities for weddings, receptions &amp; celebrations.</text>

    <!-- CTA Buttons -->
    <rect x="0" y="235" width="220" height="44" rx="4" fill="url(#mk-gold)"/>
    <text x="110" y="262" fill="#1f140e" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">ENQUIRE ON WHATSAPP →</text>

    <rect x="235" y="235" width="140" height="44" rx="4" fill="transparent" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="305" y="262" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">VIEW VENUES</text>
  </g>
</svg>
