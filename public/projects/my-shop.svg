<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bb-bg" x1="0" y1="0" x2="1200" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d0d0f"/>
      <stop offset="0.6" stop-color="#141318"/>
      <stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="bb-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bb-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>
    <linearGradient id="bb-elixir" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="bb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Luxury Background -->
  <rect width="1200" height="700" rx="16" fill="url(#bb-bg)"/>
  <rect width="1200" height="700" rx="16" stroke="rgba(251,191,36,0.15)" stroke-width="2"/>

  <!-- Top Navbar -->
  <rect x="0" y="0" width="1200" height="66" fill="#0b0b0d" fill-opacity="0.85" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <!-- Circular Brand Logo -->
  <circle cx="56" cy="33" r="13" stroke="#fbbf24" stroke-width="1.5" fill="none"/>
  <text x="76" y="30" fill="#ffffff" font-family="'Georgia', serif" font-size="16" font-weight="700" letter-spacing="1">BBBB</text>
  <text x="76" y="44" fill="#9ca3af" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="600" letter-spacing="2">BHAI BHAI BAP BETA</text>

  <!-- Nav Categories -->
  <g font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#d1d5db" letter-spacing="1.5">
    <text x="380" y="38">COSMETICS</text>
    <text x="490" y="38">BANGLES &amp; JEWELLERY</text>
    <text x="680" y="38">BRIDAL</text>
    <text x="765" y="38">FOOTWEAR &amp; TOYS</text>
    <text x="910" y="38">OUR STORY</text>
  </g>

  <!-- Center-Right 3D Cosmetics Products Artwork -->
  <!-- Ambient Gold Glow behind bottle -->
  <circle cx="680" cy="360" r="140" fill="#f59e0b" fill-opacity="0.12" filter="url(#bb-glow)"/>

  <!-- 3D Perfume / Elixir Bottle -->
  <g transform="translate(680, 260)">
    <!-- Dropper Cap -->
    <rect x="-24" y="-70" width="48" height="50" rx="20" fill="#18181b" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="0" cy="-60" r="5" fill="#fef08a"/>
    <rect x="-16" y="-20" width="32" height="20" fill="#27272a" stroke="#d4af37" stroke-width="1"/>
    <!-- Glass Bottle Outer Cylinder -->
    <rect x="-75" y="0" width="150" height="200" rx="16" fill="url(#bb-glass)" stroke="rgba(255,255,255,0.3)" stroke-width="1.8"/>
    <!-- Glowing Golden Liquid Inside -->
    <rect x="-62" y="40" width="124" height="145" rx="8" fill="url(#bb-elixir)" opacity="0.9"/>
    <!-- Liquid Highlight Reflection -->
    <path d="M-55 50 L-45 50 L-45 170 L-55 170 Z" fill="#ffffff" opacity="0.4"/>
  </g>

  <!-- Lipstick Visual -->
  <g transform="translate(480, 420) rotate(-18)">
    <rect x="-18" y="0" width="36" height="120" rx="4" fill="#18181b" stroke="#fbbf24" stroke-width="1.2"/>
    <rect x="-15" y="-25" width="30" height="25" fill="#d97706" stroke="#fbbf24" stroke-width="1"/>
    <!-- Angled Red Lipstick Bullet -->
    <path d="M-13 -25 L13 -25 L13 -55 L-13 -75 Z" fill="#dc2626"/>
    <path d="M-10 -30 L-6 -30 L-6 -65 L-10 -70 Z" fill="#ef4444" opacity="0.6"/>
  </g>

  <!-- Bangle / Golden Ring Visual -->
  <g transform="translate(860, 440)">
    <ellipse cx="0" cy="0" rx="80" ry="24" fill="#18181b" stroke="#fbbf24" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="72" ry="20" fill="none" stroke="#d97706" stroke-width="1.5"/>
  </g>

  <!-- Left Main Headline & Copy -->
  <g transform="translate(65, 230)">
    <text x="0" y="0" fill="#f59e0b" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="2.5">LALAN MARKET • GOPALGANJ • SINCE 2015</text>
    <text x="0" y="55" fill="#ffffff" font-family="'Georgia', serif" font-size="52" font-weight="700">Adornment for</text>
    <text x="0" y="115" fill="#fbbf24" font-family="'Georgia', serif" font-size="58" font-weight="700" font-style="italic">every khushi.</text>

    <!-- Subtitle Copy -->
    <text x="0" y="165" fill="#9ca3af" font-family="'Segoe UI', sans-serif" font-size="13">500+ curated products — cosmetics, bangles, jewellery,</text>
    <text x="0" y="186" fill="#9ca3af" font-family="'Segoe UI', sans-serif" font-size="13">bridal essentials and more — chosen by a family that has</text>
    <text x="0" y="207" fill="#9ca3af" font-family="'Segoe UI', sans-serif" font-size="13">dressed Gopalganj's celebrations for a decade.</text>

    <!-- CTA Buttons -->
    <rect x="0" y="245" width="200" height="46" rx="4" fill="url(#bb-gold)"/>
    <text x="100" y="274" fill="#0f0f11" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">EXPLORE COLLECTION →</text>

    <rect x="215" y="245" width="180" height="46" rx="4" fill="transparent" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <text x="305" y="274" fill="#e5e7eb" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">DISCOVER THE STORY</text>
  </g>
</svg>
